# Controllo del sito: verifica che i file JavaScript siano scritti
# correttamente prima che Vercel li pubblichi. Sito statico: niente npm.
name: Controllo sito

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Sintassi dei file JavaScript
      run: |
        status=0
        for f in $(git ls-files '*.js' | grep -v '^worker/'); do
          node --check "$f" || status=1
        done
        exit $status
    - name: Sintassi del Worker degli account
      run: |
        if [ -f worker/account-worker.js ]; then
          node --input-type=module -e "import('./worker/account-worker.js')"
        fi
